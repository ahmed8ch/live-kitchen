<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlameLink · Operations Hub (KDS & Floor Management)</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <!-- QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <!-- Modular Domain Tokens & Toast System -->
  <link rel="stylesheet" href="src/domain-tokens/tokens.css">
  <link rel="stylesheet" href="src/domain-ui/toast.css">
  <link rel="stylesheet" href="src/domain-features/table-payment.css">
  <link rel="stylesheet" href="src/domain-features/kds-pass.css">

  <style>
    /* FlameLink Design System Tokens */
    :root {
      --color-ember-orange: #ff4d00;
      --color-ember-glow: #fcddcc;
      --color-gridline: #e5e7eb;
      --color-ink: #262626;
      --color-vellum: #f9f9f9;
      --color-slate: #727272;
      --color-white: #ffffff;

      --kds-blue: #2563eb;
      --kds-orange: #ff4d00;
      --kds-red: #dc2626;
      --kds-green: #16a34a;

      --font-suisse: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-geist-mono: 'JetBrains Mono', monospace;

      --radius-pills: 999px;
      --radius-cards: 16px;
      --radius-inputs: 8px;

      --shadow-subtle: rgb(249, 249, 249) 0 0 0 6px;
      --shadow-card: rgba(0, 0, 0, 0.03) 0 20px 30px -10px, rgba(0, 0, 0, 0.02) 0 0 0 1px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-suisse);
      background-color: var(--color-white);
      color: var(--color-ink);
      line-height: 1.5;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Ops Header */
    .ops-header {
      background: #ffffff;
      border-bottom: 1px solid var(--color-gridline);
      padding: 12px 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* BRAND LOGO LOCKUP: Flame + FlameLink */
    .brand-logo-lockup {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      user-select: none;
    }

    .brand-flame-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .brand-wordmark-stack {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.05;
    }

    .brand-wordmark-top {
      font-family: var(--font-suisse);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: -0.25px;
    }

    .brand-wordmark-bottom {
      font-family: var(--font-suisse);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--color-ember-orange);
      letter-spacing: -0.25px;
      margin-top: 1px;
      padding-left: 0.8px; /* Mathematical stem lock: aligns stem of L directly under stem of t */
    }

    .wm-spacer {
      visibility: hidden;
      user-select: none;
      pointer-events: none;
      display: inline;
    }

    .ops-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 16px;
      color: var(--color-ink);
    }

    .ops-badge {
      font-family: var(--font-geist-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--radius-pills);
      background: var(--color-vellum);
      border: 1px solid var(--color-gridline);
      color: var(--color-slate);
    }

    .ops-nav-pills {
      display: flex;
      gap: 6px;
      background: var(--color-vellum);
      border: 1px solid var(--color-gridline);
      padding: 3px;
      border-radius: var(--radius-pills);
    }

    .ops-nav-btn {
      font-family: var(--font-suisse);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-slate);
      background: transparent;
      border: none;
      padding: 6px 16px;
      border-radius: var(--radius-pills);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ops-nav-btn.active {
      background: var(--color-ink);
      color: #ffffff;
    }

    .ops-header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .live-status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-geist-mono);
      font-size: 12px;
      color: #166534;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 4px 10px;
      border-radius: var(--radius-pills);
    }

    .btn-customer-portal {
      font-family: var(--font-suisse);
      font-size: 13px;
      color: var(--color-ink);
      text-decoration: none;
      border: 1px solid var(--color-gridline);
      padding: 6px 14px;
      border-radius: var(--radius-pills);
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-customer-portal:hover {
      border-color: var(--color-ember-orange);
      color: var(--color-ember-orange);
    }

    /* Main Container */
    .ops-main {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* KPI Ribbon */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--color-vellum);
      border: 1px solid var(--color-gridline);
      border-radius: var(--radius-cards);
      padding: 18px 20px;
    }

    .kpi-label {
      font-size: 12px;
      color: var(--color-slate);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-num {
      font-family: var(--font-geist-mono);
      font-size: 26px;
      font-weight: 700;
      color: var(--color-ink);
      margin-top: 4px;
    }

    /* KDS Kanban Grid */
    .kds-tickets-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .ticket-card {
      background: #ffffff;
      border: 1px solid var(--color-gridline);
      border-radius: var(--radius-cards);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ticket-header-band {
      padding: 10px 16px;
      color: #ffffff;
      font-family: var(--font-geist-mono);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .band-blue { background: var(--kds-blue); }
    .band-orange { background: var(--kds-orange); }
    .band-red { background: var(--kds-red); }
    .band-green { background: var(--kds-green); }
    .band-gray { background: #727272; }

    .ticket-content {
      padding: 16px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ticket-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--color-slate);
    }

    .ticket-items-box {
      border-top: 1px dashed var(--color-gridline);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ticket-dish-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-ink);
    }

    .ticket-modifier-detail {
      font-size: 12px;
      color: var(--color-slate);
      margin-left: 10px;
    }

    .ticket-note-highlight {
      background: #fff7ed;
      border-left: 3px solid var(--color-ember-orange);
      padding: 6px 10px;
      font-size: 12px;
      color: #9a3412;
      border-radius: 0 4px 4px 0;
      margin-top: 4px;
    }

    .ticket-footer-actions {
      padding: 14px 20px;
      border-top: 1px solid var(--color-gridline);
      background: var(--color-vellum);
    }

    .btn-action-kds {
      width: 100%;
      font-family: var(--font-suisse);
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background: var(--color-ink);
      border: none;
      padding: 10px;
      border-radius: var(--radius-pills);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action-kds.ready-step {
      background: var(--color-ember-orange);
      box-shadow: 0 0 0 4px var(--color-ember-glow);
    }

    .btn-action-kds:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    /* Floor Plan View */
    .floor-view-container {
      display: none;
      background: var(--color-vellum);
      border: 1px solid var(--color-gridline);
      border-radius: var(--radius-cards);
      padding: 32px;
    }

    .floor-sub-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .floor-sub-btn {
      font-family: var(--font-suisse);
      font-size: 13px;
      color: var(--color-slate);
      background: #ffffff;
      border: 1px solid var(--color-gridline);
      padding: 7px 18px;
      border-radius: var(--radius-pills);
      cursor: pointer;
    }

    .floor-sub-btn.active {
      background: var(--color-ink);
      color: #ffffff;
      border-color: var(--color-ink);
    }

    .floor-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .matrix-table-card {
      background: #ffffff;
      border: 1px solid var(--color-gridline);
      border-radius: var(--radius-cards);
      padding: 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .matrix-table-card:hover {
      border-color: var(--color-ember-orange);
      transform: translateY(-2px);
    }

    .mat-table-title {
      font-family: var(--font-geist-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--color-ink);
    }

    .mat-table-seats {
      font-size: 12px;
      color: var(--color-slate);
      margin: 4px 0 10px;
    }

    .badge-status {
      font-family: var(--font-geist-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pills);
      display: inline-block;
    }

    .st-avail { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .st-occ { background: #fff7ed; color: #ff4d00; border: 1px solid #fed7aa; }
    .st-res { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }

    /* RESPONSIVE LAYOUT */
    @media (max-width: 1024px) {
      .ops-header {
        padding: 10px 16px;
      }
      .kpi-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }

    @media (max-width: 768px) {
      .ops-header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 12px 14px;
      }
      .ops-brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      .ops-nav-pills {
        width: 100%;
        display: flex;
      }
      .ops-nav-btn {
        flex: 1;
        text-align: center;
        padding: 8px 10px;
        font-size: 12px;
      }
      .ops-header-right {
        display: flex;
        justify-content: space-between;
        width: 100%;
      }
      .ops-main {
        padding: 14px;
      }
      .kpi-row {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 16px;
      }
      .kpi-card {
        padding: 12px 14px;
      }
      .kpi-num {
        font-size: 20px;
      }
      .kds-tickets-container {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .floor-matrix {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .floor-sub-nav {
        overflow-x: auto;
        padding-bottom: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Ops Header -->
  <header class="ops-header">
    <div class="ops-brand-row">
      <a href="index.html" class="brand-logo-lockup" title="FlameLink" aria-label="FlameLink" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
          <path d="M12 2C12 2 8 6 8 10C8 12.21 9.79 14 12 14C14.21 14 16 12.21 16 10C16 6 12 2 12 2Z" fill="#ff4d00"/>
          <path d="M12 22C16.4183 22 20 18.4183 20 14C20 10.5 17.5 7.5 15 5.5C15.5 8 14 10 12 11C11.5 9 10 7.5 10 7.5C7.5 10 6 12 6 14C6 18.4183 8.68629 22 12 22Z" fill="#ff4d00"/>
        </svg>
        <span style="font-family: var(--font-suisse); font-size: 16px; font-weight: 700; letter-spacing: -0.3px; display: inline-flex; align-items: baseline;">
          <span style="color: #262626;">Flame</span><span style="color: #EA580C;">Link</span>
        </span>
      </a>
      <span class="ops-badge">KDS &amp; FLOOR OPS</span>
    </div>

    <div class="ops-nav-pills">
      <button class="ops-nav-btn active" id="tabKdsBtn" onclick="switchOpsTab('kds')">Kitchen Live Feed</button>
      <button class="ops-nav-btn" id="tabFloorBtn" onclick="switchOpsTab('floor')">Floor Seating Plan</button>
      <button class="ops-nav-btn" id="tabCashierBtn" onclick="TablePayment.openCashierTerminal()">Cashier Counter Desk</button>
    </div>

    <div class="ops-header-right">
      <div class="live-status-indicator">
        <span style="width:6px; height:6px; border-radius:50%; background:#16a34a;"></span>
        <span>Realtime Live</span>
      </div>
      <a href="index.html" class="btn-customer-portal">
        <span>Customer Menu</span>
        <span>-&gt;</span>
      </a>
    </div>
  </header>

  <!-- Main View -->
  <main class="ops-main">

    <!-- KPI Ribbon -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Active Tickets</div>
        <div class="kpi-num" id="kpiActiveTotal">2</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Flame Grill / Cooking</div>
        <div class="kpi-num" id="kpiInGrill" style="color: var(--kds-orange);">1</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Delayed (>15 min)</div>
        <div class="kpi-num" id="kpiDelayed" style="color: var(--kds-red);">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Avg Prep Time</div>
        <div class="kpi-num" id="kpiAvgTime">11.4m</div>
      </div>
    </div>

    <!-- KDS LIVE TICKETS SECTION -->
    <section id="sectionKdsLive">
      <div class="kds-tickets-container" id="kdsTicketsGrid">
        <!-- Rendered Dynamically -->
      </div>
    </section>

    <!-- FLOOR PLAN SECTION -->
    <section class="floor-view-container" id="sectionFloorPlan">
      <!-- Host Walk-In Party Filter -->
      <div style="background: #ffffff; border: 1px solid var(--color-gridline); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;">
        <div>
          <div style="font-size: 14px; font-weight: 600; color: var(--color-ink);">Host Station: Seat Walk-In Guests</div>
          <div style="font-size: 12px; color: var(--color-slate);">Filter available tables by party size to seat arriving guests:</div>
        </div>
        <div style="display: flex; gap: 6px;">
          <button class="floor-sub-btn active" id="btnFilterSeatsAll" onclick="filterByPartySize(0, this)">All Sizes</button>
          <button class="floor-sub-btn" id="btnFilterSeats2" onclick="filterByPartySize(2, this)">2 Persons</button>
          <button class="floor-sub-btn" id="btnFilterSeats4" onclick="filterByPartySize(4, this)">4 Persons</button>
          <button class="floor-sub-btn" id="btnFilterSeats6" onclick="filterByPartySize(6, this)">6+ Booths</button>
        </div>
      </div>

      <div class="floor-sub-nav">
        <button class="floor-sub-btn active" id="btnFloorLvl1" onclick="switchFloorOps('First Floor', this)">First Floor (Main Hall)</button>
        <button class="floor-sub-btn" id="btnFloorLvl2" onclick="switchFloorOps('Second Floor', this)">Second Floor (Balcony)</button>
        <button class="floor-sub-btn" id="btnFloorLvl3" onclick="switchFloorOps('Terrace', this)">Outdoor Terrace</button>
      </div>

      <div class="floor-matrix" id="floorMatrixGrid">
        <!-- Rendered Dynamically -->
      </div>
    </section>

  </main>

  <script>
    const FLOOR_DATA = [
      { code: 'T-01', floor: 'First Floor', seats: 2, status: 'avail' },
      { code: 'T-02', floor: 'First Floor', seats: 4, status: 'occ', guest: 'Dr. Tarek', time: '18m' },
      { code: 'T-03', floor: 'First Floor', seats: 4, status: 'avail' },
      { code: 'T-04', floor: 'First Floor', seats: 2, status: 'occ', guest: 'Table Guest', time: '4m' },
      { code: 'T-05', floor: 'First Floor', seats: 6, status: 'res', guest: 'Nour Family', time: '8:00 PM' },
      { code: 'T-06', floor: 'First Floor', seats: 8, status: 'avail' },
      { code: 'T-07', floor: 'Second Floor', seats: 4, status: 'avail' },
      { code: 'T-08', floor: 'Second Floor', seats: 4, status: 'occ', guest: 'Salma', time: '28m' },
      { code: 'T-09', floor: 'Second Floor', seats: 2, status: 'avail' },
      { code: 'T-10', floor: 'Terrace', seats: 2, status: 'avail' },
      { code: 'T-11', floor: 'Terrace', seats: 4, status: 'occ', guest: 'Karim', time: '11m' },
      { code: 'T-12', floor: 'Terrace', seats: 6, status: 'avail' }
    ];

    let currentFloor = 'First Floor';
    let partyFilterSize = 0; // 0 = all
    let supabaseClient = null;
    if (window.SUPABASE_CONFIG && window.supabase) {
      supabaseClient = window.supabase.createClient(
        window.SUPABASE_CONFIG.url,
        window.SUPABASE_CONFIG.publishableKey
      );
    }

    function switchOpsTab(tab) {
      const isKds = (tab === 'kds');
      const secKds = document.getElementById('sectionKdsLive');
      const secFloor = document.getElementById('sectionFloorPlan');
      const tabKds = document.getElementById('tabKdsBtn');
      const tabFloor = document.getElementById('tabFloorBtn');

      if (secKds) secKds.style.display = isKds ? 'block' : 'none';
      if (secFloor) secFloor.style.display = isKds ? 'none' : 'block';
      if (tabKds) tabKds.classList.toggle('active', isKds);
      if (tabFloor) tabFloor.classList.toggle('active', !isKds);

      if (!isKds) renderFloorMatrix(currentFloor);
    }

    function switchFloorOps(floor, btn) {
      currentFloor = floor;
      document.querySelectorAll('#sectionFloorPlan .floor-sub-nav .floor-sub-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderFloorMatrix(floor);
    }

    function filterByPartySize(seats, btn) {
      partyFilterSize = seats;
      document.querySelectorAll('#btnFilterSeatsAll, #btnFilterSeats2, #btnFilterSeats4, #btnFilterSeats6').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderFloorMatrix(currentFloor);
    }

    function renderFloorMatrix(floor) {
      const grid = document.getElementById('floorMatrixGrid');
      let filtered = FLOOR_DATA.filter(t => t.floor === floor);

      if (partyFilterSize > 0) {
        if (partyFilterSize === 6) {
          filtered = filtered.filter(t => t.seats >= 6);
        } else {
          filtered = filtered.filter(t => t.seats === partyFilterSize);
        }
      }

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--color-slate); padding: 30px;">No tables matching ${partyFilterSize} seats on ${floor}.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(t => `
        <div class="matrix-table-card" onclick="handleTableClick('${t.code}')">
          <div class="mat-table-title">${t.code}</div>
          <div class="mat-table-seats">${t.seats} Seats · ${floor}</div>
          <span class="badge-status st-${t.status}">${t.status === 'avail' ? 'AVAILABLE' : (t.status === 'occ' ? 'OCCUPIED' : 'RESERVED')}</span>
          ${t.guest ? `<div style="font-size:11px; color:var(--color-slate); margin-top:6px;">${t.guest} (${t.time})</div>` : ''}
          ${t.status === 'avail' ? `<div style="font-size:11px; color:var(--color-ember-orange); margin-top:8px; font-weight:600;">+ Tap to Seat Guests</div>` : ''}
        </div>
      `).join('');
    }

    function handleTableClick(code) {
      const table = FLOOR_DATA.find(t => t.code === code);
      if (!table) return;

      if (table.status === 'avail') {
        const guest = prompt(`Seat arriving walk-in guests at Table ${code} (${table.seats} seats)? Enter guest name:`, "Walk-In Diner");
        if (guest && guest.trim()) {
          table.status = 'occ';
          table.guest = guest.trim();
          table.time = 'Just seated';
          renderFloorMatrix(currentFloor);
          if (window.showToast) {
            window.showToast({
              title: 'Table Seated',
              message: `Table ${code} is now marked OCCUPIED for ${guest.trim()}.`,
              type: 'info'
            });
          }
        }
      } else {
        const action = confirm(`Table ${code} is currently ${table.status.toUpperCase()} (${table.guest || 'Seated'}). Mark as CLEAN & AVAILABLE?`);
        if (action) {
          table.status = 'avail';
          delete table.guest;
          delete table.time;
          renderFloorMatrix(currentFloor);
        }
      }
    }

    async function loadKdsTickets() {
      const kds = window.FlameKds || window.MatbakhKds;
      if (kds && kds.reload) {
        return kds.reload();
      }
    }

    async function updateTicketStatus(id, newStatus) {
      const kds = window.FlameKds || window.MatbakhKds;
      if (kds && kds.advanceStatus) {
        return kds.advanceStatus(id, newStatus);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const kds = window.FlameKds || window.MatbakhKds;
      if (kds) {
        kds.init({ containerId: 'kdsTicketsGrid' });
      }
    });
  </script>
  <script src="src/domain-ui/toast.js"></script>
  <script src="src/domain-features/kds-pass.js"></script>
  <script src="src/domain-features/table-payment.js"></script>
</body>
</html>
